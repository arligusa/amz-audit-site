<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buy Button Test</title>
<style>body{font-family:-apple-system,sans-serif;background:#f4f5f7;padding:40px;}</style>
</head>
<body>
<div id="test-status" style="margin-bottom:16px;font-size:14px;color:#333;">loading widget...</div>
<div id='product-component-arli-presale'></div>
<script type="text/javascript">
(function () {
  var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';
  function loadScript() {
    var script = document.createElement('script');
    script.async = true;
    script.src = scriptURL;
    (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script);
    script.onload = ShopifyBuyInit;
  }
  function ShopifyBuyInit() {
    var client = ShopifyBuy.buildClient({
      domain: 'arlig.myshopify.com',
      storefrontAccessToken: 'a6836f04aad6ac9499f609bc9df6f10d',
    });
    client.product.fetch('15863583179038').then(function(p){
      document.getElementById('test-status').textContent = p ? ('product fetch OK: ' + p.title) : 'product fetch returned null';
    }).catch(function(e){
      document.getElementById('test-status').textContent = 'product fetch FAILED: ' + (e && e.message ? e.message : JSON.stringify(e));
    });
    ShopifyBuy.UI.onReady(client).then(function (ui) {
      ui.createComponent('product', {
        id: '15863583179038',
        node: document.getElementById('product-component-arli-presale'),
        moneyFormat: '%24%7B%7Bamount%7D%7D',
        options: {
          "product": {
            "styles": {
              "button": {
                "background-color": "#0f6b5c",
                ":hover": { "background-color": "#0c5548" },
                ":focus": { "background-color": "#0c5548" },
                "border-radius": "8px"
              }
            },
            "text": { "button": "Add to cart" }
          },
          "cart": {
            "styles": {
              "button": {
                "background-color": "#0f6b5c",
                ":hover": { "background-color": "#0c5548" },
                ":focus": { "background-color": "#0c5548" },
                "border-radius": "8px"
              }
            },
            "text": { "total": "Subtotal", "button": "Checkout" }
          },
          "toggle": {
            "styles": {
              "toggle": {
                "background-color": "#0f6b5c",
                ":hover": { "background-color": "#0c5548" }
              }
            }
          }
        },
      }).then(function(){
        var st = document.getElementById('test-status');
        st.textContent = st.textContent + ' | component created OK';
      }).catch(function(e){
        var st = document.getElementById('test-status');
        st.textContent = st.textContent + ' | component FAILED: ' + (e && e.message ? e.message : JSON.stringify(e));
      });
    });
  }
  loadScript();
})();
</script>
</body>
</html>
